<!-- ==========================================
     MODUL PRAKTIKUM
========================================== -->

<section class="modul-page">


    <!-- HEADER -->

    <div class="modul-header">

        <div>

            <span class="modul-label">
                LABORATORIUM TEKNOLOGI ELEKTROMEDIS
            </span>

            <h1>
                Modul Praktikum
            </h1>

            <p>
                Kumpulan modul dan panduan praktikum
                untuk mendukung kegiatan pembelajaran
                mahasiswa.
            </p>

        </div>

    </div>


    <!-- ==========================================
         SEARCH & FILTER
    =========================================== -->

    <div class="modul-tools">

        <div class="modul-search">

            <i class="bi bi-search"></i>

            <input
                type="text"
                id="searchModul"
                placeholder="Cari modul praktikum...">

        </div>


        <div class="modul-filter">

            <button
                class="filter-btn active"
                data-filter="all">

                Semua

            </button>

            <button
                class="filter-btn"
                data-filter="1">

                Semester 1

            </button>

            <button
                class="filter-btn"
                data-filter="2">

                Semester 2

            </button>

            <button
                class="filter-btn"
                data-filter="3">

                Semester 3

            </button>

            <button
                class="filter-btn"
                data-filter="4">

                Semester 4

            </button>

        </div>

    </div>



    <!-- ==========================================
         DAFTAR MODUL
    =========================================== -->

    
    <div class="modul-grid" id="modulGrid">
        <!-- Card modul dibuat otomatis oleh dok.js -->
    </div>


    <!-- TIDAK DITEMUKAN -->

    <div class="modul-grid" id="modulGrid">
    <!-- Modul dari Spreadsheet akan muncul di sini -->
</div>

<div id="modulEmpty" class="text-center py-5" style="display: none;">
    <p class="text-muted">
        Modul tidak ditemukan.
    </p>
</div>

</section>
